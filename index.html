// ---------- 휴식 타이머 ----------
let timer=null,actx=null,wl=null;
function ensureAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!actx)actx=new AC();if(actx.state==="suspended")actx.resume()}catch(e){}}
document.addEventListener("pointerdown",ensureAudio,{passive:true});
function beep(){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  if(!actx)return;try{const t=actx.currentTime;[0,.28,.56].forEach(o=>{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=880;g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.35,t+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t+o+.2);os.connect(g);g.connect(actx.destination);os.start(t+o);os.stop(t+o+.22)})}catch(e){}}
async function wake(on){try{if(on&&!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request("screen");wl.addEventListener&&wl.addEventListener("release",()=>{wl=null})}else if(!on&&wl){await wl.release();wl=null}}catch(e){wl=null}}
function saveTimer(){try{timer?localStorage.setItem("split3-timer",JSON.stringify(timer)):localStorage.removeItem("split3-timer")}catch(e){}}
function startTimer(sec,name){ensureAudio();timer={end:Date.now()+sec*1000,total:sec,name,done:false};saveTimer();wake(true);tick()}
function stopTimer(){timer=null;saveTimer();wake(false);tick()}
function tick(){
  const bar=$("tbar");
  if(!timer){bar.hidden=true;bar.classList.remove("done");document.body.classList.remove("timing");return}
  bar.hidden=false;document.body.classList.add("timing");
  const left=Math.ceil((timer.end-Date.now())/1000);
  if(left<=0){
    if(!timer.done){timer.done=true;saveTimer();beep();wake(false);const t0=timer;setTimeout(()=>{if(timer===t0)stopTimer()},15000)}
    bar.classList.add("done");$("tlabel").textContent="휴식 끝";$("ttime").textContent="다음 세트!";$("tprog").style.width="100%";
  }else{
    bar.classList.remove("done");$("tlabel").textContent=timer.name+" · 휴식";$("ttime").textContent=mmss(left);
    $("tprog").style.width=`${Math.max(0,Math.min(100,100-left/timer.total*100))}%`;
  }
}
setInterval(()=>{if(timer)tick()},250);
function restoreTimer(){try{const t=JSON.parse(localStorage.getItem("split3-timer")||"null");if(t&&t.end>Date.now()-15000){timer=t;tick()}}catch(e){}}

// 목표 세트 수를 채우는 순간 완료 체크 (직접 해제하면 다시 체크하지 않음)
function autoCheck(b,id,before){const e=EX[id],after=doneCount(b.sets[id]),goal=e?exerciseGoal(e,keyOf(view)):0;if(e&&before<goal&&after>=goal&&!b.checks[id]){b.checks[id]=true;return true}return false}

// ---------- 입력 ----------
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-act]");if(!t||t.tagName==="INPUT"||t.tagName==="TEXTAREA")return;
  const act=t.dataset.act,id=t.dataset.ex,k=keyOf(view);
  // Historical dates use date-specific edit actions only. Global routine
  // management is explicitly blocked so it cannot rewrite a past snapshot.
  if(k<keyOf(today())&&tab==="day"){
    const allowed=['tab','prev','next','today','day','export','snooze',
      'pick','unset','change','cancelchange','expand','pastchangesession','pastpick','pastcancelchange','pastaddex','pastremoveex',
      'pasttoggle','pastaddset','pastdelset','pasttag','pastrest','dayup','daydown','addchoice'];
    if(!allowed.includes(act)){toast('지난 날짜는 그날의 운동기록만 수정할 수 있습니다');return;}
  }
  if(act==="dayup"||act==="daydown"){
    moveDayExercise(id,act==="dayup"?-1:1);return;
  }
  if(act==="tab"){
    if(tab==='routine'&&pendingPlanCards()){toast('저장하지 않은 세트 구성이 있습니다. 구성 저장 후 이동하세요');return;}
    tab=t.dataset.t;changing=false;render();window.scrollTo(0,0);return}
  if(act==="prev"||act==="next"){view=addDays(view,act==="prev"?-7:7);open.clear();changing=false;render();return}
  if(act==="today"){view=today();open.clear();changing=false;render();return}
  if(act==="day"){view=parseKey(t.dataset.k);open.clear();changing=false;render();return}
  if(k<keyOf(today())&&tab==="day"&&act.startsWith("past")){
    if(!backend){toast('저장소 연결을 확인하세요');return;}
    const b=body(k);
    if(act==="pastchangesession"){
      changing=true;render();return;
    }
    if(act==="pastcancelchange"){
      changing=false;render();return;
    }
    if(act==="pastrest"){
      const counts=dataCount(b);
      const apply=()=>{
        const empty=norm(null);
        empty.rest=true;
        // The past day is marked as rest. Existing records must be explicitly
        // confirmed before removal; historical days outside this date are untouched.
        empty.memo=b.memo;
        changing=false;open.clear();persist(k,empty);
      };
      if(b.session&&(counts.sets||counts.checks)){
        ask(`${k}의 ${counts.sets}개 세트 및 완료 표시 ${counts.checks}개가 이 날짜에서 삭제됩니다. '운동 안 함'으로 변경할까요?`,"휴식으로 변경",apply);
      }else apply();
      return;
    }
    if(act==="pastpick"){
      const sid=t.dataset.s;
      if(!SMAP[sid])return;
      if(b.session===sid&&!b.rest){changing=false;render();return;}
      const previous=b.session;
      const apply=()=>{
        // Copy the selected session's CURRENT routine to THIS historical date.
        // Never change the global routine, and never delete recorded exercise rows.
        const fresh=makeDaySnapshot(sid);
        if(!fresh){toast('루틴을 불러오지 못했습니다');return;}
        fresh.createdForPast=true;
        fresh.sessionCorrected=!!previous;
        if(previous)fresh.previousSession=previous;
        const freshIds=new Set(fresh.ex.map(e=>e.id));
        const previousSnapshot=validDaySnapshot(b.routineSnapshot,previous)?b.routineSnapshot:null;
        const previousEx=previousSnapshot?previousSnapshot.ex:[];
        const recordedIds=[...new Set([...Object.keys(b.sets||{}),...Object.keys(b.checks||{})])];
        for(const oldId of recordedIds){
          if(freshIds.has(oldId))continue;
          const earlier=previousEx.find(e=>e.id===oldId);
          const ex=earlier||EX[oldId]||DEFMAP[oldId];
          const archived=ex?cloneDayExercise(ex):{id:oldId,n:(b.alts||{})[oldId]||`이전 운동 (${oldId})`,rest:90,sets:3,top:0,alts:[],plan:null};
          fresh.ex.push({...archived,archived:true});
        }
        b.session=sid;b.rest=false;b.routineSnapshot=fresh;
        changing=false;open.clear();persist(k,b);
      };
      const cnt=dataCount(b);
      if(previous&&(cnt.sets||cnt.checks)){
        ask(`${k}의 세션을 ${SMAP[previous]?.short||previous} → ${SMAP[sid].short}로 변경할까요? ${SMAP[sid].short} 루틴을 불러옵니다. 기존 세트는 아래 '변경 전 기록 보관'에 유지됩니다.`,"루틴 불러오기",apply);
      }else apply();
      return;
    }
    if(!b.session)return;
    if(act==="pastaddex"){
      const input=$("past-ex-name"),name=(input?.value||'').trim().slice(0,40);
      if(!name){toast('운동종목 이름을 입력해 주세요');return;}
      const snapshot=ensurePastSnapshot(k,b);
      const exists=snapshot.ex.some(e=>e.n===name);
      if(exists){toast('이미 해당 날짜에 있는 운동입니다');return;}
      const candidate=SESS.flatMap(r=>r.ex).find(e=>e.n===name);
      const item=candidate?cloneDayExercise(candidate):{id:'historic-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),n:name,sets:3,top:0,rest:90,tgt:'',part:'',alts:[],plan:null};
      // Historical exercises get their own ID; never mutate the global template.
      item.id='historic-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
      snapshot.ex.push({...item,n:name});
      open.add(item.id);persist(k,b);return;
    }
    const e=pastExercise(k,b,id);
    if(!e)return;
    ensurePastSnapshot(k,b);
    if(act==="pasttoggle"){
      if(b.checks[id])delete b.checks[id];else b.checks[id]=true;
      persist(k,b);return;
    }
    if(act==="pastaddset"){
      const list=b.sets[id]||(b.sets[id]=[]);
      const last=list[list.length-1];
      list.push({kg:last?.kg??'',reps:'',tag:last?.tag||''});
      open.add(id);persist(k,b);return;
    }
    if(act==="pastdelset"){
      const list=b.sets[id]||[],i=Number(t.dataset.i);
      if(!Number.isInteger(i)||i<0||i>=list.length)return;
      list.splice(i,1);if(!list.length)delete b.sets[id];
      pastMaybeCheck(b,e);persist(k,b);return;
    }
    if(act==="pasttag"){
      const r=b.sets[id]?.[Number(t.dataset.i)];if(!r)return;
      const next=TAG_NEXT[r.tag||''];if(next)r.tag=next;else delete r.tag;
      persist(k,b);return;
    }
    if(act==="pastremoveex"){
      ask(`이 날짜(${k})에서 '${e.n}' 기록을 제거할까요? 다른 날짜의 기록과 기본 루틴은 변경되지 않습니다.`,"이 날짜에서 제거",()=>{
        const b=body(k),snapshot=ensurePastSnapshot(k,b);
        snapshot.ex=snapshot.ex.filter(x=>x.id!==id);
        delete b.sets[id];delete b.checks[id];delete b.alts[id];
        open.delete(id);persist(k,b);
      });return;
    }
    return;
  }
  if(act==="expand"){open.has(id)?open.delete(id):open.add(id);render();return}
  if(act==="prow"){const n=t.dataset.n;popen.has(n)?popen.delete(n):popen.add(n);render();return}
  if(act==="tminus"&&timer){if(timer.done)return;timer.end-=15000;saveTimer();tick();return}
  if(act==="tplus"&&timer){if(timer.done){timer.done=false;timer.end=Date.now()+15000;timer.total=15;wake(true)}else{timer.end+=15000;timer.total+=15}saveTimer();tick();return}
  if(act==="tstop"){stopTimer();return}
  if(act==="timer"){const b=body(k);startTimer(EX[id].rest,exName(id,b));return}
  if(act==="export"){exportBackup();return}
  if(act==="snooze"){lsSet("split3-snooze",Date.now()+3*864e5);render();return}
  if(act==="planadd"){changePlanRows(id,null);return}
  if(act==="planremove"){changePlanRows(id,Number(t.dataset.i));return}
  if(act==="plansave"){if(backend)savePlanCard(id);return}
  if(act==="rsel"){
    if(pendingPlanCards()){toast('저장하지 않은 세트 구성이 있습니다. 구성 저장 후 루틴을 바꾸세요');return;}
    rsel=t.dataset.s;render();return}
  if(act==="editsess"){openEditor({kind:"sess",sid:rsel});return}
  if(act==="editex"){openEditor({kind:"ex",id});return}
  if(act==="addchoice"){openAddChoice(t.dataset.s||rsel);return}
  if(act==="newex"){openEditor({kind:"ex",sid:t.dataset.s||rsel});return}
  if(act==="libraryadd"){openExerciseLibrary("add",t.dataset.s||rsel,null);return}
  if(act==="libraryreplace"){const ex=EX[id];if(ex)openExerciseLibrary("replace",ex.s,id);return}
  if(act==="removeex"){if(backend)removeRoutineExercise(id);return}
  if(act==="discardtoday"){if(backend)discardSelectedDay();return}

  if(act==="up"||act==="down"){if(backend)moveEx(id,act==="up"?-1:1);return}
  if(act==="resetroutine"){if(backend)resetRoutine();return}
  if(act==="change"){changing=true;render();window.scrollTo(0,0);return}
  if(act==="cancelchange"){changing=false;render();return}
  if(!backend)return;
  const b=body(k);
  if(act==="pick"){
    const sid=t.dataset.s;
    if(b.session===sid){changing=false;render();return}
    const c=dataCount(b);
    const apply=()=>{
      const nb=norm(null);nb.memo=b.memo;nb.session=sid;
      nb.routineSnapshot=makeDaySnapshot(sid);
      if(k<keyOf(today())&&nb.routineSnapshot)nb.routineSnapshot.createdForPast=true;
      changing=false;open.clear();persist(k,nb);
    };
    if(b.session&&(c.sets||c.checks))ask(`${SMAP[b.session].name}에 기록한 ${c.sets}세트와 완료 체크 ${c.checks}개가 지워져요. ${SMAP[sid].name}(으)로 바꿀까요?`,"바꾸기",apply);else apply();
    return;
  }
  if(act==="unset"){
    const c=dataCount(b),apply=()=>{const nb=norm(null);nb.memo=b.memo;changing=false;open.clear();persist(k,nb)};
    if(c.sets||c.checks)ask(`이 날 기록한 ${c.sets}세트와 완료 체크 ${c.checks}개가 지워져요. 휴식으로 바꿀까요?`,"휴식으로",apply);else apply();
    return;
  }
  if(act==="toggle"){if(b.checks[id])delete b.checks[id];else b.checks[id]=true;persist(k,b);return}
  if(act==="loadplanned"){
    const e=EX[id],plan=e&&latestExercisePlan(e.s,id,k),index=Number(t.dataset.i);
    if(!plan||!Number.isInteger(index)||index<0||index>=plan.rows.length)return;
    const list=b.sets[id]||(b.sets[id]=[]);
    // Work sequentially so the draft list cannot silently skip earlier sets.
    if(index!==list.length){toast("앞의 미입력 세트부터 순서대로 불러와 주세요");return}
    const prior=plan.rows[index];
    list.push({kg:prior.kg,reps:"",tag:prior.tag});
    open.add(id);persist(k,b);
    requestAnimationFrame(()=>{const el=$(`rp-${k}-${id}-${index}`);if(el)el.focus()});
    return;
  }
  if(act==="addset"||act==="adddrop"){
    const e=EX[id],list=b.sets[id]||(b.sets[id]=[]),nm=exName(id,b),st=stepOf(e);
    const p=list[list.length-1],tops=list.filter(x=>x.tag==="T").length;
    const fromSuggest=()=>{const snap=previousSessionSnapshot(b.session,k),arr=snap&&snap.sets[id],l=arr&&arr.length?{k:snap.date,sets:arr}:null,sg=suggest(e,l);if(sg)return {kg:sg.kg>0?sg.kg:"",reps:sg.reps||""};return {kg:"",reps:""}};
    let row;
    if(act==="adddrop"){if(!p)return;row={kg:num(p.kg)>0?roundTo(num(p.kg)*DROP,st):p.kg,reps:p.reps,tag:"D"}}
    else if(!p){row=fromSuggest();if(e.top)row.tag="T"}
    else if(p.tag==="W"){row=e.top&&!tops?{...fromSuggest(),tag:"T"}:{kg:p.kg,reps:p.reps}}
    else if(p.tag==="T"&&tops<e.top){row={kg:p.kg,reps:p.reps,tag:"T"}}
    else if(p.tag==="T"){row={kg:num(p.kg)>0?roundTo(num(p.kg)*BACKOFF,st):p.kg,reps:num(p.reps)>0?num(p.reps)+2:p.reps}}
    else if(p.tag==="D"){const q=[...list].reverse().find(x=>x.tag!=="D"&&x.tag!=="W")||p;row={kg:q.kg,reps:q.reps}}
    else row={kg:p.kg,reps:p.reps};
    // Use the matching set from the latest SAME routine as reference; preserve recorded
    // reps blank so a prior result cannot be mistaken for a completed current set.
    if(act==="addset"){
      const snapshot=previousSessionSnapshot(b.session,k),prior=previousExerciseSet(snapshot,id,list.length);
      if(prior){row.kg=prior.kg;row.tag=prior.tag||"";row.reps="";}
    }
    row.reps="";  // Actual reps must be entered explicitly.
    list.push(row);persist(k,b);
    requestAnimationFrame(()=>{const el=$(`kg-${k}-${id}-${list.length-1}`);if(el){el.focus();el.select&&el.select()}});
    return;
  }
  if(act==="delset"){const list=b.sets[id]||[];list.splice(Number(t.dataset.i),1);if(!list.length)delete b.sets[id];persist(k,b);return}
  if(act==="tag"){const list=b.sets[id]||[],i=Number(t.dataset.i),s=list[i];if(!s)return;const before=doneCount(list);const nt=TAG_NEXT[s.tag||""];if(nt)s.tag=nt;else delete s.tag;
    const pv=list[i-1];if(s.tag==="D"&&pv&&num(pv.kg)>0&&num(s.kg)===num(pv.kg))s.kg=roundTo(num(pv.kg)*DROP,stepOf(EX[id]));
    if(autoCheck(b,id,before))toast(`${exName(id,b)} ${exerciseGoal(EX[id],k)}세트 완료`);persist(k,b);return}
  if(act==="setalt"){const v=t.dataset.v;if(v===EX[id].n)delete b.alts[id];else b.alts[id]=v;persist(k,b);return}
  if(act==="altcustom"){const v=($(`alt-${k}-${id}`).value||"").trim().slice(0,40);if(!v){toast("교체할 종목 이름을 입력해 주세요");return}
    document.activeElement&&document.activeElement.blur&&document.activeElement.blur();b.alts[id]=v;persist(k,b);return}
});
document.addEventListener("change",ev=>{
  const t=ev.target;if(!backend||!t.dataset)return;
  const k=keyOf(view);
  if(k<keyOf(today())&&tab==="day"){
    if(t.dataset.act==="pastmemo"){
      const b=body(k);if(!b.session)return;
      b.memo=t.value.slice(0,2000);persist(k,b,true);return;
    }
    if(t.dataset.act!=="pastkg"&&t.dataset.act!=="pastreps")return;
    const b=body(k),id=t.dataset.ex,e=pastExercise(k,b,id);
    if(!b.session||!e)return;
    const list=b.sets[id]||[],record=list[Number(t.dataset.i)];if(!record)return;
    const raw=t.value.trim().replace(',','.');
    const v=raw===''?'':Number(raw);
    if(raw!==''&&(!Number.isFinite(v)||v<0||(t.dataset.act==='pastreps'&&!Number.isInteger(v)))){
      toast('중량은 0 이상, 횟수는 0 이상의 정수로 입력해 주세요');t.value=record[t.dataset.act==='pastkg'?'kg':'reps']??'';return;
    }
    ensurePastSnapshot(k,b);
    record[t.dataset.act==='pastkg'?'kg':'reps']=v;
    persist(k,b,true);
    return;
  }
  if(t.dataset.act==="memo"){const b=body(k),v=t.value.slice(0,2000);if(b.memo===v)return;b.memo=v;if(!b.session&&!v)return;persist(k,b,true);return}
  if(t.dataset.act!=="kg"&&t.dataset.act!=="reps")return;
  const b=body(k),id=t.dataset.ex,list=b.sets[id]||[],s=list[Number(t.dataset.i)];if(!s)return;
  const v=t.value.trim().replace(",",".");const n=v===""?"":Number(v);
  if(v!==""&&(!isFinite(n)||n<0)){t.value=s[t.dataset.act]??"";return}
  if(s[t.dataset.act]===n)return;
  const nm=exName(id,b),base=prBase(nm,k,buildIndex()),wasPR=isPR(s,base),before=doneCount(list);
  s[t.dataset.act]=n;
  const nowPR=isPR(s,base),done=autoCheck(b,id,before);
  persist(k,b,true);
  if(nowPR&&!wasPR)toast(`신기록! ${nm} ${fmtSet({kg:num(s.kg),reps:num(s.reps)})}${done?` · ${exerciseGoal(EX[id],k)}세트 완료`:""}`);
  else if(done)toast(`${nm} ${exerciseGoal(EX[id],k)}세트 완료`);
  if(t.dataset.act==="reps"&&n>0&&s.tag!=="W"){
    const next=list[Number(t.dataset.i)+1];
    if(!next||next.tag!=="D")startTimer(EX[id].rest,nm);
  }
});
document.addEventListener("keydown",ev=>{
  const t=ev.target;if(ev.key!=="Enter"||!t.id)return;
  if(t.id.startsWith("alt-")){ev.preventDefault();const btn=t.parentElement.querySelector("[data-act='altcustom']");btn&&btn.click()}
});
document.addEventListener("focusout",()=>setTimeout(()=>{if(pendingRender)render()},200));

// ---------- 백업 (웹앱 전용) ----------
async function exportBackup(){
  const data=JSON.stringify({app:"split3-log",version:3,exportedAt:new Date().toISOString(),days:docs,routine:routineCustom?routineData():null});
  const name=`운동일지-백업-${keyOf(today())}.json`,file=new File([data],name,{type:"application/json"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});lsSet("split3-lastbackup",Date.now());toast("백업 파일을 저장했어요");render();return}}
  catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);lsSet("split3-lastbackup",Date.now());toast("백업 파일을 저장했어요");render();
}
$("importFile").addEventListener("change",async ev=>{
  const f=ev.target.files&&ev.target.files[0];ev.target.value="";if(!f||!backend||!backend.saveAll)return;
  try{
    const j=JSON.parse(await f.text()),days=j&&j.days;
    if(!days||typeof days!=="object"||Array.isArray(days))throw 0;
    const m={};for(const [k,v] of Object.entries(days))if(/^\d{4}-\d{2}-\d{2}$/.test(k)){const b=norm(v);if(!isEmpty(b))m[k]=b}
    ask(`백업에 ${Object.keys(m).length}일치 기록이 있어요. 지금 기록을 이 백업으로 바꿀까요?`,"덮어쓰기",async()=>{
      docs=m;try{if("routine" in j){applyRoutine(j.routine);await backend.saveRoutine(routineCustom?routineData():null)}await backend.saveAll();toast("백업을 불러왔어요")}catch(e){setStatus("저장하지 못했어요. 휴대폰 저장 공간을 확인해 주세요.",true)}render()});
  }catch(e){toast("운동일지 백업 파일이 아니에요. 이 앱에서 저장한 .json 파일을 골라 주세요.")}
});

// 앱을 다시 열었을 때 날짜가 바뀌었으면 오늘로 이동
let lastToday=keyOf(today());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;const t=keyOf(today());if(t!==lastToday&&keyOf(view)===lastToday)view=today();lastToday=t;if(timer){tick();if(!timer.done)wake(true)}render()});

async function start(){
  render();restoreTimer();
  if(IS_PWA){backend=localBackend();loaded=true;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}render();
    if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});syncStart();return}
  let db=null,uid=null;
  try{const c=window.claude;if(c&&c.use){const [d,u]=await Promise.all([c.use("db"),c.use("user")]);db=d;uid=u?await u.id():null}}catch(e){db=null}
  if(db&&uid){
    const col=db.collection("data/users/"+uid),chains={};
    const q=(k,fn)=>(chains[k]=(chains[k]||Promise.resolve()).catch(()=>{}).then(fn));
    backend={save(k,b){return q(k,()=>isEmpty(b)?col.doc(k).delete():col.doc(k).set(b))},saveRoutine(r){return q("routine",()=>r?col.doc("routine").set(r):col.doc("routine").delete())}};
    col.onSnapshot(snap=>{const m={};let rt=null;snap.docs.forEach(d=>{if(!d.exists)return;if(d.id==="routine"){rt=d.data();return}if(/^\d{4}-\d{2}-\d{2}$/.test(d.id)){const b=norm(d.data());if(!isEmpty(b))m[d.id]=b}});
      applyRoutine(rt);docs=m;loaded=true;render()},
      ()=>setStatus("기록 동기화가 끊겼어요. 페이지를 새로 열어 주세요.",true));
  }else{backend=localBackend();loaded=true;setStatus("이 브라우저에만 저장 중");render()}
}
start();
</script>
