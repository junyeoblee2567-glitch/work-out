<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>운동일지 · 워치 연동 v0.5.24</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="운동일지">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1E24" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<script>window.__PWA=1</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone app. Header = title + 운동/기록 tabs, week strip on the 운동 tab.
   Sessions rotate in order (가슴→광배→하체→어깨→승모) instead of being pinned to weekdays.
   Session colors follow competition bumper plates (red, blue, yellow, green) + gray. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --ink:#16181D; --muted:#626874; --line:#DDE0E6; --accent:#1F5FAF; --done:#2E7D4F; --warn:#B4541A;
  --p-A:#C8372D; --p-B:#1F5FAF; --p-C:#C99700; --p-D:#2E7D4F; --p-E:#5E6673; --p-rest:#A9AEB8;
  --f-display:"Barlow Condensed","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317; --surface:#1B1E24; --ink:#ECEEF2; --muted:#9AA0AB; --line:#2C3038; --accent:#6EA0E8; --done:#5CC08A; --warn:#E59A5C;
  --p-A:#E8645A; --p-B:#6EA0E8; --p-C:#E9C04A; --p-D:#5CC08A; --p-E:#A3AAB6; --p-rest:#5A606B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1B1E24; --ink:#ECEEF2; --muted:#9AA0AB; --line:#2C3038; --accent:#6EA0E8; --done:#5CC08A; --warn:#E59A5C;
  --p-A:#E8645A; --p-B:#6EA0E8; --p-C:#E9C04A; --p-D:#5CC08A; --p-E:#A3AAB6; --p-rest:#5A606B; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px;display:grid;gap:10px}
.top{display:flex;align-items:center;gap:10px}
h1{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;background:var(--bg);border-radius:9px;padding:3px;gap:2px}
.tabs button{font-size:13px;font-weight:500;padding:5px 14px;border-radius:7px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.nav{display:flex;align-items:center;gap:4px}
.nav .range{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:1;text-align:center}
.icon{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon:active{background:var(--line)}
.today{font-size:12px;font-weight:500;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.day{display:grid;justify-items:center;gap:1px;padding:5px 0 6px;border-radius:10px;min-width:0}
.day .dw{font-size:11.5px;color:var(--muted)}
.day .dn{font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.day .sl{font-size:11px;font-weight:700;color:var(--c);line-height:1.3;white-space:nowrap}
.day .sl.rest{color:var(--muted);font-weight:400}
.day .bar{width:62%;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:2px}
.day .bar i{display:block;height:100%;background:var(--c)}
.day.sel{background:var(--bg)}
.day.is-today .dw{color:var(--ink);font-weight:700}
.weeksum{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.weeksum b{color:var(--ink);font-weight:500}
.weeksum .mono{font-family:var(--f-mono)}

main .wrap{padding-block:18px 40px;display:grid;gap:14px}
body.timing main .wrap{padding-bottom:120px}
.loading{color:var(--muted);text-align:center;padding:40px 0}
.dayhead{display:grid;grid-template-columns:1fr auto;align-items:end;gap:4px 10px;border-left:6px solid var(--c);padding-left:12px}
.dayhead .k{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500;grid-column:1/-1}
.dayhead h2{margin:0;font-size:22px;font-weight:700;text-wrap:balance;min-width:0}
.dayhead .prog{font-size:13px;color:var(--muted);grid-column:1}
.dayhead .prog b{font-family:var(--f-mono);color:var(--ink);font-weight:500}
.dayhead .chg{grid-column:2;grid-row:2/4;align-self:center;font-size:12.5px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px}

.advice{font-size:13.5px;color:var(--warn);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pick{display:grid;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:12px 14px}
.pick .pk{font-size:12px;color:var(--muted);letter-spacing:.04em}
.pick b{font-size:17px}
.pick .pa{font-size:12.5px;color:var(--muted)}
.pick.next{padding:16px 16px 16px 14px;border-width:2px 2px 2px 8px;border-color:var(--c)}
.pick.next b{font-size:21px}
.pick.cur{opacity:.6}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.ghost{font-size:13px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--surface)}

.list{display:grid;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;min-width:0}
.row{display:grid;grid-template-columns:44px 1fr auto;align-items:start;gap:4px;padding:12px 10px 12px 6px}
.chk{width:44px;height:44px;display:grid;place-items:center;margin-top:-8px}
.chk span{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.chk[aria-pressed="true"] span{background:var(--done);border-color:var(--done)}
.chk svg{opacity:0;color:var(--surface)}
.chk[aria-pressed="true"] svg{opacity:1}
.info{min-width:0;display:grid;gap:2px}
.name{font-weight:700;font-size:16px;line-height:1.35}
.name .orig{font-weight:400;font-size:12px;color:var(--muted);margin-left:4px}
.card.done .name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.meta{font-size:13px;color:var(--muted)}
.meta .tg{font-family:var(--f-mono);font-size:12.5px;color:var(--ink)}
.upb{display:inline-block;font-size:11px;font-weight:700;color:var(--done);border:1px solid var(--done);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}
.note{font-size:12.5px;color:var(--muted);padding-left:8px;border-left:2px solid var(--line);margin-top:2px}
.side{display:grid;justify-items:end;gap:6px}
.vid{font-family:var(--f-mono);font-size:12px;color:var(--accent);text-decoration:none;padding:2px 0;white-space:nowrap}
.logbtn{font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.logbtn[aria-expanded="true"]{color:var(--ink);border-color:var(--ink)}
.logbtn .n{font-family:var(--f-mono)}

.sets{border-top:1px dashed var(--line);padding:10px 12px 12px;display:grid;gap:8px;min-width:0}
.hist{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.hist b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.goal{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:0 8px;background:var(--bg);border-radius:8px;padding:8px 10px}
.goal span{font-size:12px;color:var(--muted)}
.goal b{font-family:var(--f-mono);font-weight:500;font-size:15px}
.goal small{grid-column:1/-1;font-size:12px;color:var(--muted)}
.goal.up b{color:var(--done)}
.set{display:grid;grid-template-columns:44px 1fr 12px 1fr 28px 30px;align-items:center;gap:5px}
.prb{font-size:10.5px;font-weight:700;color:var(--surface);background:var(--done);border-radius:4px;padding:1px 0;text-align:center;letter-spacing:.02em}
.field input::placeholder{color:var(--muted);opacity:.55}
.set-previous{padding:0 8px 5px 52px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.lastsets{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lastsets b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.lastsets i{font-style:normal;font-size:11px}
.drop{font-size:13px;font-weight:500;color:var(--p-B);padding:6px 0}
.nag{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--warn);border-radius:10px;padding:10px 12px}
.nag span{flex:1 1 180px}
.nag button{font-size:12.5px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.nag .go{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.prlist{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid}
.prr{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.prr:last-child{border-bottom:0}
.prr .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prr .v{font-family:var(--f-mono);font-size:12.5px;text-align:right}
.prr small{display:block;font-size:11.5px;color:var(--muted)}
.tag{height:30px;border-radius:7px;border:1px solid var(--line);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tag.t-T{border-color:var(--p-A);color:var(--p-A);font-family:var(--f-body);font-weight:700}
.tag.t-D{border-color:var(--p-B);color:var(--p-B);font-family:var(--f-body);font-weight:700}
.tag.t-W{border-style:dashed;font-family:var(--f-body)}
.set .x{text-align:center;color:var(--muted);font-size:13px}
.field{position:relative;min-width:0}
.field input{width:100%;font:500 16px var(--f-mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 28px 8px 10px;font-variant-numeric:tabular-nums}
.field small{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.del{width:30px;height:34px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.acts{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.add{font-size:13.5px;font-weight:500;color:var(--accent);padding:6px 0}
.tbtn{font-size:12.5px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.vol{font-size:12px;color:var(--muted);font-family:var(--f-mono);margin-left:auto}
.legend{font-size:11.5px;color:var(--muted)}
.alt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.alt > span{font-size:12px;color:var(--muted);margin-right:2px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface)}
.chip.on{border-color:var(--ink);font-weight:700}
.altc{display:flex;gap:6px;flex:1 1 180px;min-width:0}
.altc input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.altc button{font-size:12.5px;font-weight:500;color:var(--accent);padding:0 6px}
.memo{display:grid;gap:6px}
.memo label{font-size:12px;color:var(--muted);letter-spacing:.04em}
.memo textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:72px;resize:vertical;width:100%}

.sec{display:grid;gap:8px}
.sec h3{margin:0;font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.balr{display:grid;grid-template-columns:76px 1fr 92px;align-items:center;gap:8px;font-size:13px}
.balr .bt{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.balr .bt i{display:block;height:100%;background:var(--c);border-radius:4px}
.balr .bn{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.balr .bn.stale{color:var(--warn)}
.pgroup{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pgroup h4{margin:0;padding:9px 12px;font-size:13.5px;border-left:5px solid var(--c);border-bottom:1px solid var(--line)}
.prow{width:100%;display:grid;grid-template-columns:1fr 72px 58px;align-items:center;gap:8px;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
.pgroup > :last-child{border-bottom:0}
.prow .pn{font-weight:500;font-size:14px;display:block}
.prow .pl{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prow .pb{font-family:var(--f-mono);font-size:12.5px;text-align:right}
.prow.empty{color:var(--muted)}
.prow.empty .pn{font-weight:400}
.spark{width:72px;height:24px;display:block}
.pdet{padding:4px 12px 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.pdet table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.pdet th{font-weight:500;color:var(--muted);text-align:left;padding:4px 6px 4px 0;font-size:11.5px}
.pdet td{padding:4px 6px 4px 0;border-top:1px solid var(--line);white-space:nowrap}
.pdet td.mono{font-family:var(--f-mono)}
.backup{display:flex;flex-wrap:wrap;gap:8px}
.backup button,.backup label{font-size:13px;font-weight:500;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer}
.backup input{display:none}

.tbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--ink);color:var(--surface);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:8px}
.tbar .tl{font-size:12.5px;opacity:.8;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar .tt{font-family:var(--f-mono);font-size:28px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.tbar button{color:var(--surface);border:1px solid currentColor;border-radius:8px;font-size:13px;font-weight:500;padding:7px 10px;opacity:.9}
.tbar .tp{position:absolute;left:0;top:0;height:3px;background:var(--p-C)}
.tbar.done{background:var(--done)}
.sheetbg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:grid;align-items:end}
.sheet{background:var(--surface);border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;max-width:640px;width:100%;margin:0 auto}
.sheet p{margin:0;font-size:15px}
.sheet .btns{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.sheet.ed{max-height:88vh;overflow-y:auto;gap:12px;border-radius:16px 16px 0 0}
.sheet h3{margin:0;font-size:17px}
.sheet.ed .btns{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-18px - env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.ef{display:grid;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.ef input,.ef select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.ef small{font-size:11.5px}
.efrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ederr{color:var(--p-A);font-size:13px;margin:0}
.sheet .del-ex{color:var(--p-A);border-color:transparent;padding-left:0}
.rsess{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rs{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;font-weight:700;font-size:14px;color:var(--c)}
.rs.on{border:2px solid var(--c);background:var(--bg)}
.rrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 12px 8px 6px;border-bottom:1px solid var(--line)}
.rmv{display:grid;gap:2px}
.rmv button{width:32px;height:26px;border-radius:6px;color:var(--muted);font-size:14px}
.rmv button:disabled{opacity:.25;cursor:default}
.sm{padding:5px 12px;font-size:12.5px}
.lnk{font-size:12.5px;color:var(--muted);text-decoration:underline;padding:2px 0}
.addex{justify-self:start;font-size:14px;font-weight:500;color:var(--accent);padding:6px 2px}
.sheet button{font-size:14px;font-weight:500;border-radius:10px;padding:9px 16px;border:1px solid var(--line)}
.sheet .ok{background:var(--p-A);border-color:var(--p-A);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);font-size:13px;padding:9px 16px;border-radius:999px;z-index:40;max-width:calc(100% - 32px);text-align:center}
body.timing .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.status{font-size:12px;color:var(--muted);text-align:center;margin:0 0 8px}
.status.err{color:var(--p-A)}
footer{font-size:12px;color:var(--muted);text-align:center;padding:0 16px 24px}
footer a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* 2026-11-07 · Watch/workout management parity */
.workout-tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.workout-tools button,.ex-tools button{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface);color:var(--ink);font:inherit;font-size:12px;font-weight:650;cursor:pointer}
.workout-tools .danger,.ex-tools .danger{color:#d4535d;border-color:rgba(212,83,93,.4)}
.ex-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.library-overlay{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:48;display:flex;justify-content:center;align-items:center;padding:18px}
.library-overlay[hidden]{display:none}
.library-panel{width:min(100%,430px);max-height:85dvh;overflow:auto;background:var(--surface);color:var(--ink);border-radius:18px;padding:18px;box-shadow:0 14px 54px #0005}
.library-panel h3{margin:0 0 5px;font-size:18px}
.library-panel p{margin:0 0 10px;font-size:12px;color:var(--muted)}
.library-panel input{width:100%;box-sizing:border-box;margin:5px 0 10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.library-items{display:grid;gap:6px;max-height:50dvh;overflow:auto}
.library-count{margin:0 0 5px!important;font-size:11px!important;color:var(--muted)}
.library-items button{border:1px solid var(--line);border-radius:10px;padding:11px;text-align:left;background:var(--bg);color:var(--ink);font:inherit}
.library-items small{display:block;font-size:11px;margin-top:3px;color:var(--muted)}
.library-cancel{margin-top:12px;padding:11px 15px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}

.exercise-choice-buttons{display:grid;gap:10px;margin:16px 0 4px}
.exercise-choice-buttons button{background:var(--bg);color:var(--ink);font:600 14px var(--f-body);padding:14px;text-align:left;border:1px solid var(--line);border-radius:12px}
.exercise-choice-buttons small{display:block;font-size:11px;color:var(--muted);margin-top:5px;font-weight:400}
.day-order{display:flex;gap:4px;align-items:center;flex-shrink:0}
.day-order button{border:1px solid var(--line);color:var(--ink);background:var(--bg);border-radius:9px;min-width:30px;height:34px;font-size:17px}
.day-order button:disabled{opacity:.25}
/* v0.5.20: editable, exercise-by-exercise routine cards */
.routine-cards{display:grid;gap:12px}
.routine-card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:grid;gap:10px;min-width:0}
.routine-card .routine-card-header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.routine-card .routine-card-title{flex:1;min-width:0;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.routine-card .routine-card-toolbar{display:flex;gap:4px;flex-shrink:0}
.routine-card .routine-card-toolbar button{border:1px solid var(--line);border-radius:8px;font-size:12px;padding:6px 9px}
.routine-card .routine-plan-note{font-size:11px;color:var(--muted)}
.routine-plan-labels,.routine-plan-row{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 27px;gap:5px;align-items:center}
.routine-plan-labels{font-size:10px;color:var(--muted);text-align:center}
.routine-plan-row .plan-index{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.routine-plan-row input,.routine-plan-row select{width:100%;min-width:0;padding:8px 3px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.routine-plan-row .plan-remove{height:34px;border-radius:8px;background:var(--bg);color:var(--muted);font-size:18px}
.routine-card-actions{display:flex;gap:6px;flex-wrap:wrap}
.routine-card-actions button{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface)}
.routine-card-actions .plan-save{background:var(--accent);border-color:var(--accent);color:#fff}
.routine-card-actions .plan-delete{color:#d4535d;border-color:rgba(212,83,93,.35)}
.routine-card .plan-badge{color:var(--accent);font-size:11px;font-weight:600}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <h1>3분할 운동일지</h1>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-day" data-act="tab" data-t="day" aria-selected="true">운동</button>
        <button role="tab" id="tab-prog" data-act="tab" data-t="prog" aria-selected="false">기록</button>
        <button role="tab" id="tab-routine" data-act="tab" data-t="routine" aria-selected="false">루틴</button>
      </div>
    </div>
    <div id="weekbox">
      <div class="nav">
        <button class="icon" data-act="prev" aria-label="지난 주"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <span class="range" id="range">—</span>
        <button class="icon" data-act="next" aria-label="다음 주"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>

      </div>
      <div class="strip" id="strip"></div>
    </div>
    <div class="weeksum" id="weeksum"></div>
  </div>
</header>

<main><div class="wrap" id="app"><p class="loading">기록을 불러오는 중…</p></div></main>
<p class="status" id="status"></p>
<footer>루틴 출처: <a href="https://www.youtube.com/watch?v=hIJhYHw7vSA" target="_blank" rel="noopener">이도황 · 더 큰 프레임과 사이즈를 위한 3분할 루틴</a></footer>
<section class="wrap" id="watchSync" style="padding-bottom:24px;font-size:13px"></section>

<div class="tbar" id="tbar" hidden>
  <div class="tp" id="tprog"></div>
  <div class="in">
    <div style="min-width:0"><div class="tl" id="tlabel"></div><div class="tt" id="ttime">0:00</div></div>
    <button data-act="tminus" aria-label="15초 줄이기">−15</button>
    <button data-act="tplus" aria-label="15초 늘리기">+15</button>
    <button data-act="tstop">끝</button>
  </div>
</div>
<div class="sheetbg" id="sheet" style="z-index:35" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetText">
    <p id="sheetText"></p>
    <div class="btns"><button id="sheetNo" type="button">취소</button><button class="ok" id="sheetYes" type="button">확인</button></div>
  </div>
</div>
<div class="sheetbg" id="editor" hidden>
  <form class="sheet ed" id="edForm" novalidate role="dialog" aria-modal="true" aria-labelledby="edTitle">
    <h3 id="edTitle"></h3>
    <div id="edFields" style="display:grid;gap:12px"></div>
    <p class="ederr" id="edErr" hidden></p>
    <div class="btns"><button type="button" class="del-ex" id="edDel">루틴에서 삭제</button><span style="flex:1"></span><button type="button" id="edCancel">취소</button><button type="submit" class="ok">저장</button></div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>

<div class="library-overlay" id="addExerciseChoice" hidden>
  <section class="library-panel" role="dialog" aria-modal="true" aria-labelledby="addChoiceTitle">
    <h3 id="addChoiceTitle">운동종목 추가</h3>
    <p>어디에서 운동종목을 가져올까요?</p>
    <div class="exercise-choice-buttons">
      <button type="button" id="chooseExistingExercise">⌕ 기존 운동에서 선택 <small>전체 루틴 · 대체 운동 · 숨겨진 종목 검색</small></button>
      <button type="button" id="chooseNewExercise">＋ 새로운 운동 만들기 <small>운동명과 세트 계획을 새로 설정</small></button>
    </div>
    <button class="library-cancel" type="button" id="addChoiceCancel">취소</button>
  </section>
</div>
<div class="library-overlay" id="exerciseLibrary" hidden>
  <section class="library-panel" role="dialog" aria-modal="true" aria-labelledby="libraryTitle">
    <h3 id="libraryTitle">전체 운동종목</h3>
    <p id="libraryHint">다른 루틴의 종목도 선택할 수 있습니다.</p>
    <input type="search" id="librarySearch" placeholder="운동종목 검색" aria-label="운동종목 검색">
    <div class="library-items" id="libraryItems"></div>
    <button class="library-cancel" type="button" id="libraryCancel">닫기</button>
  </section>
</div>
<script>
const IS_PWA=!!window.__PWA;
const YT="https://www.youtube.com/watch?v=hIJhYHw7vSA";
// r: 목표 반복 범위(영상 기준), inc: 증량 단위(kg), rest: 기본 휴식(초), alts: 대체 종목
function X(id,n,tgt,part,o){o=o||{};return {id,n,tgt,part,note:o.note||"",t:o.t==null?null:o.t,r:o.r||null,inc:o.inc||0,rest:o.rest||90,alts:o.alts||[]}}
const SESS_DEFAULT=[
 {id:"A",name:"가슴 위주 밀기",short:"가슴",ex:[
  X("m1","벤치프레스","탑 1세트 6~8 + 백오프 8~10","가슴",{note:"탑세트 8회 되면 다음엔 +5kg",t:204,r:[6,8],inc:5,rest:150}),
  X("m2","인클라인 덤벨 프레스","프리웨이트","윗가슴",{t:262,rest:120}),
  X("m3","체스트 플라이","","가슴",{rest:60}),
  X("m4","딥스","","가슴·삼두",{rest:90}),
  X("m5","머신 숄더 프레스","3세트","전면 어깨",{t:304,rest:90}),
  X("m6","사이드 레터럴 레이즈","15~20회 × 4","측면 어깨",{t:318,r:[15,20],inc:1,rest:60}),
  X("m7","오버헤드 익스텐션","3세트","삼두 장두",{t:340,rest:60}),
  X("m8","케이블 푸시다운","3세트","삼두 외측두",{t:340,rest:60})]},
 {id:"B",name:"광배 위주 당기기",short:"광배",ex:[
  X("t1","하이로우","탑 2세트 8~10 (고중량)","광배",{t:358,r:[8,10],inc:5,rest:150,alts:["원암 랫풀다운","케이블 풀다운"]}),
  X("t2","풀오버 머신","10~15회","광배",{t:393,r:[10,15],inc:5,rest:90,alts:["덤벨 풀오버","암풀다운"]}),
  X("t3","랫풀다운","10~12회","광배",{t:427,r:[10,12],inc:5,rest:90,alts:["어시스트 풀업"]}),
  X("t4","체스트 서포티드 티바로우","10~12회 × 3","등 상부",{t:440,r:[10,12],inc:5,rest:120}),
  X("t5","다이스키","10~15회 × 3","측·후면 어깨",{t:467,r:[10,15],inc:1,rest:60}),
  X("t6","리버스 펙덱 플라이","10~15회 × 3","후면 어깨",{t:467,r:[10,15],inc:2.5,rest:60}),
  X("t7","해머컬","6~8회 × 3 (고중량)","이두 메인",{t:480,r:[6,8],inc:2,rest:90}),
  X("t8","프리처컬","10~15회 × 3","이두",{t:490,r:[10,15],inc:2,rest:60})]},
 {id:"C",name:"하체 & 복근",short:"하체",ex:[
  X("w1","이너 타이","15~20회 × 3","웜업·가동성",{t:523,r:[15,20],inc:5,rest:60}),
  X("w2","아웃 타이","15~20회 × 3","웜업·가동성",{t:523,r:[15,20],inc:5,rest:60}),
  X("w3","불가리안 스플릿 스쿼트","8~10회 × 2","하체 메인",{t:548,r:[8,10],inc:2,rest:120}),
  X("w4","핵스쿼트","8~12회 × 3","대퇴사두",{t:621,r:[8,12],inc:10,rest:150}),
  X("w5","덤벨 스티프 레그 데드리프트","10~15회 × 3","햄스트링·후면",{t:628,r:[10,15],inc:2,rest:90}),
  X("w6","레그 익스텐션","마무리","전면 하체",{t:670,rest:60}),
  X("w7","크런치","15~20회 × 3","상복부",{t:683,r:[15,20],rest:45,alts:["케이블 크런치"]}),
  X("w8","레그레이즈","15~20회 × 3","하복부",{t:683,r:[15,20],rest:45,alts:["행잉 레그레이즈"]}),
  X("w9","사이드 크런치","양쪽 15회 × 3","옆구리",{t:683,rest:45})]},
 {id:"D",name:"어깨 위주 밀기",short:"어깨",ex:[
  X("f1","덤벨 숄더 프레스","탑 8~10 + 백오프 10~12","어깨",{t:735,r:[8,10],inc:2,rest:150}),
  X("f2","스미스 비하인드 넥 프레스","10~15회 × 3","어깨",{t:764,r:[10,15],inc:5,rest:90}),
  X("f3","사이드 레터럴 레이즈","4세트","측면 어깨",{t:776,rest:60}),
  X("f4","플라이 머신","10~15회 × 3","가슴",{t:797,r:[10,15],inc:5,rest:90,alts:["머신 체스트 프레스"]}),
  X("f5","딥스","10~15회 × 3","가슴·삼두",{t:802,r:[10,15],inc:2.5,rest:90}),
  X("f6","라잉 트라이셉스 익스텐션","8~12회 × 3","삼두",{t:810,r:[8,12],inc:2.5,rest:90}),
  X("f7","케이블 푸시다운","마무리","삼두 외측두",{t:820,rest:60})]},
 {id:"E",name:"승모 위주 당기기",short:"승모",ex:[
  X("s1","체스트 서포티드 티바로우","탑 2세트 8~10 + 트리플 드롭","등 두께 (메인)",{note:"마지막 세트는 트리플 드롭세트",t:840,r:[8,10],inc:5,rest:150}),
  X("s2","투암 하이로우","10~15회 × 3","중하부 승모·원근",{t:883,r:[10,15],inc:5,rest:90}),
  X("s3","로우로우","10~15회 × 3","중상부 승모",{t:915,r:[10,15],inc:5,rest:90,alts:["바벨로우","벤치 덤벨로우"]}),
  X("s4","암풀다운","3세트","대원근",{t:935,rest:60}),
  X("s5","롱풀","3세트","광배 하부",{t:943,rest:90}),
  X("s6","페이스풀","3세트","후면 어깨",{t:952,rest:60,alts:["바벨 레이즈"]}),
  X("s7","리버스 리어델트 플라이","3세트","후면 어깨",{t:957,rest:60}),
  X("s8","덤벨컬","6~8회 × 3 (고중량)","이두 메인",{t:963,r:[6,8],inc:2,rest:90}),
  X("s9","케이블 해머컬","3세트","이두",{t:972,rest:60})]}
];
// 목표 세트 수(sets)와 탑세트 수(top). 영상에 세트 수가 없는 종목은 3세트로 둡니다.
const DEF_SETS={m1:2,m6:4,t1:2,w3:2,f1:2,f3:4,s1:3},DEF_TOP={m1:1,t1:2,f1:1,s1:2};
SESS_DEFAULT.forEach(x=>x.ex.forEach(e=>{e.sets=DEF_SETS[e.id]||3;e.top=DEF_TOP[e.id]||0}));
const DEFMAP={};SESS_DEFAULT.forEach(x=>x.ex.forEach(e=>DEFMAP[e.id]=e));
const ORDER=["A","B","C","D","E"];
let SESS=[],SMAP={},EX={},routineCustom=false;
const fin=n=>typeof n==="number"&&isFinite(n);
function deriveTop(t){const m=String(t||"").match(/탑\s*(\d)\s*세트/);return m?Math.min(3,Number(m[1])):/탑/.test(t||"")?1:0}
function deriveSets(t,top){if(top)return top+1;const m=String(t||"").match(/[×x]\s*(\d+)/)||String(t||"").match(/(\d+)\s*세트/);const n=m?Number(m[1]):3;return n>=1&&n<=10?n:3}
const okInt=(n,a,b)=>Number.isInteger(n)&&n>=a&&n<=b;
function cleanEx(e){
  if(!e||!e.id||!e.n)return null;
  const d=DEFMAP[e.id];
  const top=okInt(e.top,0,3)?e.top:d?d.top:deriveTop(e.tgt);
  const sets=okInt(e.sets,1,10)?e.sets:d?d.sets:deriveSets(e.tgt,top);
  const r=Array.isArray(e.r)&&e.r.length===2&&e.r.every(n=>fin(n)&&n>0)&&e.r[0]<=e.r[1]?[e.r[0],e.r[1]]:null;
  const plan=Array.isArray(e.plan)?e.plan.slice(0,30).filter(v=>v&&typeof v==="object").map(v=>({
    kg:Number.isFinite(Number(v.kg))?Math.max(0,Math.min(500,Number(v.kg))):0,
    reps:Number.isInteger(Number(v.reps))?Math.max(0,Math.min(100,Number(v.reps))):0,
    tag:["","W","T","B","D"].includes(v.tag)?v.tag:""
  })):null;
  return {plan,id:String(e.id).slice(0,40),n:String(e.n).slice(0,40),tgt:String(e.tgt||"").slice(0,40),part:String(e.part||"").slice(0,30),note:String(e.note||"").slice(0,80),
    t:fin(e.t)&&e.t>=0?Math.round(e.t):null,r,inc:fin(e.inc)&&e.inc>=0?e.inc:0,rest:fin(e.rest)&&e.rest>0?Math.round(e.rest):90,
    alts:Array.isArray(e.alts)?e.alts.map(a=>String(a).trim().slice(0,40)).filter(Boolean).slice(0,6):[],sets,top,del:!!e.del};
}
function applyRoutine(r){
  let src=SESS_DEFAULT;routineCustom=false;
  if(r&&Array.isArray(r.sessions)&&r.sessions.length===5&&r.sessions.every((x,i)=>x&&x.id===ORDER[i]&&Array.isArray(x.ex))){src=r.sessions;routineCustom=true}
  SESS=src.map((x,i)=>{const d=SESS_DEFAULT[i];const seen=new Set();
    return {id:ORDER[i],name:String(x.name||d.name).slice(0,30),short:String(x.short||d.short).slice(0,4),
      ex:x.ex.map(cleanEx).filter(e=>e&&!seen.has(e.id)&&seen.add(e.id))}});
  SMAP={};EX={};SESS.forEach(x=>{SMAP[x.id]=x;x.c="--p-"+x.id;x.ex.forEach(e=>{e.s=x.id;EX[e.id]=e})});
}
function routineData(){return {v:1,sessions:SESS.map(x=>({id:x.id,name:x.name,short:x.short,ex:x.ex.map(e=>{const o={id:e.id,n:e.n,tgt:e.tgt,part:e.part,note:e.note,t:e.t,r:e.r,inc:e.inc,rest:e.rest,alts:e.alts,sets:e.sets,top:e.top};if(e.del)o.del=true;if(Array.isArray(e.plan))o.plan=e.plan;return o})}))}}
const activeEx=x=>x.ex.filter(e=>!e.del);
// A date-owned copy of the exercises and their order. Editing a routine later
// must never change a workout already started on another date.
const cloneDayExercise=e=>({id:e.id,n:e.n,tgt:e.tgt||"",part:e.part||"",note:e.note||"",rest:e.rest||90,
  sets:e.sets||3,top:e.top||0,r:e.r||null,inc:e.inc||0,alts:Array.isArray(e.alts)?[...e.alts]:[],
  plan:Array.isArray(e.plan)?e.plan.map(q=>({...q})):null,t:e.t??null});
function makeDaySnapshot(sid){
  const s=SMAP[sid];
  return s?{v:1,session:sid,name:s.name,ex:activeEx(s).map(cloneDayExercise)}:null;
}
function validDaySnapshot(snapshot,sid){
  return snapshot&&snapshot.v===1&&snapshot.session===sid&&Array.isArray(snapshot.ex)&&snapshot.ex.length<=100;
}
function snapshotExercises(b){
  if(!b||!b.session)return null;
  if(!validDaySnapshot(b.routineSnapshot,b.session))return null;
  return b.routineSnapshot.ex.filter(e=>e&&e.id&&e.n).map(e=>({...e,s:b.session,del:false,archived:!!e.archived}));
}
function dayExerciseList(k,b){
  const snapshot=snapshotExercises(b);
  if(snapshot){
    if(k<keyOf(today())){
      const recorded=[...new Set([...Object.keys(b.sets||{}),...Object.keys(b.checks||{})])];
      const known=new Set(snapshot.map(e=>e.id));
      for(const id of recorded){if(known.has(id))continue;
        const ex=EX[id]||DEFMAP[id];
        snapshot.push(ex?{...cloneDayExercise(ex),s:b.session,archived:true,del:false}:{id,n:(b.alts||{})[id]||`이전 운동 (${id})`,s:b.session,archived:true,rest:90,sets:3,top:0,alts:[],plan:null,t:null});
      }
    }
    return snapshot;
  }
  // Legacy days have no snapshot. Reconstruct ONLY exercises with recorded
  // sets/completion; do not substitute the current routine as if it were history.
  if(k<keyOf(today())){
    const ids=[...new Set([...Object.keys(b.sets||{}),...Object.keys(b.checks||{})])];
    return ids.map(id=>{
      const ex=EX[id]||DEFMAP[id];
      return ex?{...cloneDayExercise(ex),s:b.session,del:false}:{id,n:(b.alts||{})[id]||`이전 운동 (${id})`,s:b.session,rest:90,sets:3,top:0,alts:[],plan:null,t:null};
    });
  }
  return activeEx(SMAP[b.session]);
}

function topSet(list){return list.reduce((a,s)=>{const kg=num(s.kg),r=num(s.reps);return (!a||kg>a.kg||(kg===a.kg&&r>a.reps))?{kg,reps:r}:a},null)}
function buildIndex(){

    const b=docs[k];

      if(!EX[id])continue;
      const valid=list.filter(s=>s.tag!=="W"&&(num(s.kg)>0||num(s.reps)>0));
      if(!valid.length)continue;
      const name=exName(id,b);
      (idx[name]||(idx[name]={sess:EX[id].s,entries:[]})).entries.push({k,sets:valid});

}
function suggest(e,last){
  if(!last)return null;
  const t=topSet(last.sets);
  if(e.r){
    const [lo,hi]=e.r;
    if(t.kg>0&&e.inc>0&&t.reps>=hi)return {kg:Math.round((t.kg+e.inc)*100)/100,reps:lo,up:true,why:`지난번 ${fmtSet(t)}회로 목표 상단(${hi}회) 달성 → +${fmt(e.inc)}kg`};
    if(t.kg>0)return {kg:t.kg,reps:Math.min(Math.max(t.reps+1,lo),hi),why:`같은 무게로 ${hi}회까지 반복 수 늘리기`};
    return {kg:0,reps:t.reps+1,why:"지난번보다 1회 더"};
  }

}
const e1rm=t=>t.kg>0&&t.reps>0?Math.round(t.kg*(1+t.reps/30)*2)/2:0;
const setE1=x=>e1rm({kg:num(x.kg),reps:num(x.reps)});

function doneCount(list){let n=0;for(const x of list||[]){if(x.tag==="W"||x.tag==="D"||!(num(x.reps)>0))continue;n++}return n}
function prBase(nm,k,idx){const en=((idx[nm]||{}).entries||[]).filter(x=>x.k<k);let kg=0,e1=0;for(const x of en)for(const q of x.sets){kg=Math.max(kg,num(q.kg));e1=Math.max(e1,setE1(q))}return {has:en.length>0,kg,e1}}

function nextSession(k){for(let i=KEYS.length-1;i>=0;i--){const x=KEYS[i];if(x<k&&docs[x].session)return ORDER[(ORDER.indexOf(docs[x].session)+1)%ORDER.length]}return ORDER[0]}
function lastDone(sid,k){for(let i=KEYS.length-1;i>=0;i--){const x=KEYS[i];if(x<k&&docs[x].session===sid)return x}return null}
function streak(k){let d=addDays(parseKey(k),-1),n=0;while(docs[keyOf(d)]&&docs[keyOf(d)].session){n++;d=addDays(d,-1)}return n}
function dayDone(k){const b=docs[k];if(!b||!b.session)return 0;const ex=dayExerciseList(k,b);return ex.length?ex.filter(e=>b.checks[e.id]).length/ex.length:0}

// Last same-session workout is the only source of previous sets (matches Wear OS).
function previousSessionSnapshot(sid,k){
  const dates=KEYS.filter(d=>d<k&&docs[d]&&docs[d].session===sid&&Object.values(docs[d].sets||{}).some(a=>Array.isArray(a)&&a.length));
  if(!dates.length)return null;
  const date=dates[dates.length-1];
  return {date,sets:docs[date].sets||{}};
}
function previousExerciseSet(snapshot,id,index){
  if(!snapshot)return null;
  const sets=snapshot.sets[id];
  return Array.isArray(sets)?sets[index]||null:null;
}
// Most recent performance of this specific exercise within its own routine.
// Derived at render time: never overwrites today's recorded sets or historical data.
function latestExercisePlan(sid,id,k){
  const custom=EX[id]&&EX[id].plan;
  if(Array.isArray(custom)&&custom.length)return {date:"직접 설정",manual:true,rows:custom.map(x=>({...x}))};
  const snapshot=previousSessionSnapshot(sid,k);
  const rows=snapshot&&snapshot.sets&&snapshot.sets[id];
  if(!Array.isArray(rows)||!rows.length)return null;
  // Only completed sets are used as the next-session template.
  const completed=rows.filter(x=>x&&Number(x.reps)>0&&Number.isFinite(Number(x.kg)));
  if(!completed.length)return null;
  return {date:snapshot.date,rows:completed.map(x=>({kg:Number(x.kg)||0,reps:Number(x.reps),tag:x.tag||""}))};
}
// Show the full previous session's set count, not a static 3-set default.
function exerciseGoal(e,k){
  const plan=latestExercisePlan(e.s,e.id,k);
  return plan?(plan.manual?plan.rows.length:Math.max(1,doneCount(plan.rows))):e.sets;
}

function spark(vals,c){
  if(!vals.length)return "";
  const v=vals.slice(-12),mn=Math.min(...v),mx=Math.max(...v),W=72,H=24,p=3;
  const xy=v.map((y,i)=>[v.length===1?W/2:p+(W-2*p)*i/(v.length-1),mx===mn?H/2:H-p-(H-2*p)*(y-mn)/(mx-mn)]);
  const [ex,ey]=xy[xy.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true">${v.length>1?`<polyline points="${xy.map(q=>q.map(n=>n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(${c})" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/>`:""}<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="2.6" fill="var(${c})"/></svg>`;
}
function renderProgress(){

  const prs=[];for(const [nm,o] of Object.entries(idx)){let bk=0,be=0;o.entries.forEach((x,i)=>{let tk2=0,te=0,tset=null,eset=null;for(const q of x.sets){if(num(q.kg)>tk2){tk2=num(q.kg);tset=q}if(setE1(q)>te){te=setE1(q);eset=q}}

  h+=`</div></div><div class="sec"><h3>종목별 기록</h3>`;

        h+=`</tbody></table></div>`;
      }
    }
    if(withData.length&&none)h+=`<div style="padding:7px 12px;font-size:12px;color:var(--muted)">기록 없는 종목 ${none}개</div>`;

  }
  h+=`</div>`;
  if(IS_PWA){const lb=lsGet("split3-lastbackup");h+=`<div class="sec"><h3>백업</h3><p class="hint">기록은 이 휴대폰 안에만 있어요. 마지막 백업: <b>${lb?`${md(keyOf(new Date(lb)))} (${agoText(Math.floor((Date.now()-lb)/864e5))})`:"아직 없음"}</b>. 2주가 지나면 운동 화면에서 알려 드려요.</p><div class="backup"><button data-act="export">기록 백업 파일 저장</button><label for="importFile">백업 파일 불러오기</label></div></div>`}

let rsel="A",edState=null;
function exMeta(e){return [`${e.sets}세트${e.top?` (탑 ${e.top})`:""}`,e.tgt,e.part,e.r?`목표 ${e.r[0]}~${e.r[1]}회${e.inc?` · +${fmt(e.inc)}kg`:""}`:"",`휴식 ${mmss(e.rest)}`].filter(Boolean).map(esc).join(" · ")}
function routinePlanRows(ex){
  const explicit=Array.isArray(ex.plan)&&ex.plan.length?ex.plan:null;
  if(explicit)return explicit.map(x=>({...x}));
  const recent=latestExercisePlan(ex.s,ex.id,keyOf(today()));
  if(recent&&recent.rows.length)return recent.rows.map(x=>({...x}));
  return Array.from({length:ex.sets},(_,i)=>({kg:0,reps:ex.r?ex.r[0]:0,tag:i<ex.top?"T":ex.top?"B":""}));
}
function routinePlanRowHTML(id,row,i){
  const sel=[['','일반'],['W','웜업'],['T','탑'],['B','백오프'],['D','드롭']]
    .map(([v,label])=>`<option value="${v}"${(row.tag||'')===v?' selected':''}>${label}</option>`).join('');
  return `<div class="routine-plan-row" data-plan-index="${i}">
    <span class="plan-index">${i+1}</span>
    <select data-plan-field="tag" aria-label="${i+1}세트 유형">${sel}</select>
    <input type="number" inputmode="decimal" min="0" max="500" step="0.5" data-plan-field="kg" aria-label="${i+1}세트 중량" value="${esc(row.kg)}">
    <input type="number" inputmode="numeric" min="0" max="100" step="1" data-plan-field="reps" aria-label="${i+1}세트 반복" value="${esc(row.reps)}">
    <button class="plan-remove" type="button" data-act="planremove" data-ex="${id}" data-i="${i}" aria-label="${i+1}세트 삭제">×</button>
  </div>`;
}
function renderRoutine(){
  const s=SMAP[rsel],act=activeEx(s);
  let h=`<div class="rsess" role="tablist">${SESS.map(x=>`<button class="rs${x.id===rsel?" on":""}" style="--c:var(${x.c})" data-act="rsel" data-s="${x.id}" aria-selected="${x.id===rsel}">${esc(x.short)}</button>`).join("")}</div>`;
  h+=`<div class="dayhead" style="--c:var(${s.c})"><span class="k">${ORDER.indexOf(s.id)+1}번째 세션 · 순서대로 돌아가요</span><h2>${esc(s.name)}</h2><span class="prog"><b>${act.length}</b>종목</span><button class="chg" data-act="editsess">이름 바꾸기</button></div>`;
  h+=`<p class="hint">종목별 세트 유형·중량·횟수를 입력하고 <b>구성 저장</b>을 누르세요. 각 종목의 <b>↑ ↓</b>로 순서를 변경합니다. 과거 운동기록은 변경되지 않습니다.</p>`;
  h+=`<div class="routine-cards">`;
  if(!act.length)h+=`<p class="hint">종목이 없습니다. 아래의 종목 추가를 이용하세요.</p>`;
  for(let i=0;i<act.length;i++){
    const e=act[i],rows=routinePlanRows(e);
    const manually=Array.isArray(e.plan)&&e.plan.length;
    const recent=!manually?latestExercisePlan(s.id,e.id,keyOf(today())):null;
    h+=`<section class="routine-card" data-plan-ex="${e.id}">
      <div class="routine-card-header"><div class="routine-card-title">${i+1}. ${esc(e.n)}</div>
        <div class="routine-card-toolbar"><button data-act="up" data-ex="${e.id}" ${i===0?'disabled':''} aria-label="${esc(e.n)} 위로 이동" title="위로 이동">↑</button><button data-act="down" data-ex="${e.id}" ${i===act.length-1?'disabled':''} aria-label="${esc(e.n)} 아래로 이동" title="아래로 이동">↓</button></div></div>
      <div class="routine-plan-note">${manually?'직접 설정한 기본 구성':recent?'최근 운동 기록에서 불러온 구성':'기본 구성'} · ${rows.length}세트</div>
      <div class="routine-plan-labels"><span>세트</span><span>유형</span><span>중량 kg</span><span>횟수</span><span></span></div>
      <div class="routine-plan-rows">${rows.map((r,j)=>routinePlanRowHTML(e.id,r,j)).join('')}</div>
      <div class="routine-card-actions"><button data-act="planadd" data-ex="${e.id}">＋ 세트 추가</button><button class="plan-save" data-act="plansave" data-ex="${e.id}">구성 저장</button><button data-act="editex" data-ex="${e.id}">종목 설정</button><button class="plan-delete" data-act="removeex" data-ex="${e.id}">종목 삭제</button></div>
      </section>`;
  }
  h+=`</div><button class="addex" data-act="addchoice" data-s="${s.id}">＋ 운동종목 추가 (기존 / 새로 만들기)</button>`;
  if(routineCustom)h+=`<button class="ghost" style="justify-self:start" data-act="resetroutine">영상 기본 루틴으로 되돌리기</button>`;
  $("app").innerHTML=h;
}
function collectRoutineCard(id){
  const card=[...document.querySelectorAll('.routine-card')].find(el=>el.dataset.planEx===id);
  if(!card)return null;
  const rows=[...card.querySelectorAll('.routine-plan-row')];
  if(!rows.length){toast('최소 1세트가 필요합니다');return null}
  const plan=[];
  for(const row of rows){
    const get=key=>row.querySelector(`[data-plan-field="${key}"]`).value;
    const kg=Number(get('kg')), reps=Number(get('reps')),tag=get('tag');
    if(!Number.isFinite(kg)||kg<0||kg>500||!Number.isInteger(reps)||reps<0||reps>100){
      toast('중량은 0~500kg, 횟수는 0~100 정수로 입력하세요');return null;
    }
    plan.push({kg,reps,tag});
  }
  return plan;
}
async function savePlanCard(id){
  const ex=EX[id],plan=collectRoutineCard(id);
  if(!ex||!plan)return;
  const prior=ex.plan,priorSets=ex.sets,priorTop=ex.top;
  ex.plan=plan;ex.sets=Math.min(10,plan.length);ex.top=plan.filter(x=>x.tag==='T').length;
  const ok=await saveRoutine();
  if(ok)toast(`${ex.n} 기본 구성 저장 완료`);
  else {ex.plan=prior;ex.sets=priorSets;ex.top=priorTop;render();toast('저장 실패. 다시 시도하세요')}
}
function changePlanRows(id,removeIndex){
  const card=document.querySelector(`.routine-card[data-plan-ex="${id}"]`);
  if(!card)return;
  const rows=collectRoutineCard(id);
  if(!rows)return;
  if(removeIndex===null){if(rows.length>=30){toast('최대 30세트까지 추가할 수 있습니다');return}
    const last=rows[rows.length-1];rows.push(last?{...last}:{kg:0,reps:0,tag:''});
  }else{if(rows.length<=1){toast('최소 1세트는 유지해야 합니다');return}rows.splice(removeIndex,1)}
  card.querySelector('.routine-plan-rows').innerHTML=rows.map((r,i)=>routinePlanRowHTML(id,r,i)).join('');
  card.querySelector('.routine-plan-note').textContent=`편집 중 · ${rows.length}세트 (구성 저장을 눌러 적용)`;
}

function hasData(id){for(const k of KEYS){const b=docs[k];if(b.sets[id]||b.checks[id]||b.alts[id])return true}return false}
async function saveRoutine(reset){
  const r=reset?null:routineData();
  try{
    await backend.saveRoutine(r);
    applyRoutine(r);
    render();
    syncQueueRoutine();
    return true;
  }catch(e){
    setStatus("루틴 저장에 실패했습니다. 저장 공간과 연결 상태를 확인하세요.",true);
    return false;
  }
}
// ----- 운동 화면에서도 접근 가능한 전체 종목 관리 -----
let libraryIntent=null;
let libraryChoices=new Map();
/** Normalize whitespace/punctuation so e.g. '티바 로우' finds '티바로우'. */
function librarySearchKey(value){
  return String(value||"").normalize("NFKC").toLocaleLowerCase("ko")
    .replace(/[\s\u00a0\u200b\-_.·()（）/]/g,"");
}
/** Include active, hidden, default and alternative exercises. Distinct routines
 *  with the same exercise name stay visible with a source label. */
function libraryEntries(){
  const items=[],seen=new Set();
  const add=(ex,session,kind,sourceKey)=>{
    if(!ex||!String(ex.n||"").trim())return;
    const key=sourceKey+"|"+kind+"|"+String(ex.n).trim();
    if(seen.has(key))return;
    seen.add(key);
    items.push({key,exercise:ex,session,kind});
  };
  const addSession=(sess,kind)=>{
    for(const ex of sess.ex){
      const sourceKey=sess.id+":"+ex.id;
      add(ex,sess.short||sess.name,ex.del?"숨긴 종목":kind,sourceKey);
      for(const alt of (Array.isArray(ex.alts)?ex.alts:[])){
        const name=String(alt||"").trim();
        if(!name)continue;
        const template={...ex,n:name,t:null,note:"",tgt:"",top:0,alts:[],del:false};
        add(template,sess.short||sess.name,"대체 종목",sourceKey);
      }
    }
  };
  for(const sess of SESS)addSession(sess,"현재 루틴");
  for(const sess of SESS_DEFAULT)addSession(sess,"기본 루틴");
  return items.sort((a,b)=>a.exercise.n.localeCompare(b.exercise.n,"ko")||a.session.localeCompare(b.session,"ko"));
}
/** A fresh ID for every library copy. Avoid reusing the ID of an exercise in
 *  another session because workout records are keyed by exercise ID. */
function newRoutineExerciseId(){
  let id;
  do {
    id="u"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  } while(EX[id] || SESS.some(sess=>sess.ex.some(ex=>ex.id===id)));
  return id;
}
function closeExerciseLibrary(){libraryIntent=null;libraryChoices.clear();$("exerciseLibrary").hidden=true}
function displayExerciseLibrary(){
  if(!libraryIntent)return;
  const query=librarySearchKey($("librarySearch").value.trim());
  const items=libraryEntries().filter(x=>{
    const searchable=x.exercise.n+" "+x.exercise.part+" "+x.session+" "+x.kind;
    return librarySearchKey(searchable).includes(query);
  });
  libraryChoices=new Map(items.map(x=>[x.key,x.exercise]));
  $("libraryItems").replaceChildren();
  const count=document.createElement("p");
  count.className="library-count";
  count.textContent=`검색 결과 ${items.length}개 · 이름이 같아도 루틴별로 표시`;
  $("libraryItems").appendChild(count);
  for(const itemData of items){
    const {key,exercise,session,kind}=itemData;
    const item=document.createElement("button");item.type="button";
    item.textContent=exercise.n;
    const meta=document.createElement("small");
    meta.textContent=session+" · "+kind+(exercise.part?" · "+exercise.part:"");
    item.appendChild(meta);
    item.onclick=()=>chooseLibraryExercise(key);
    $("libraryItems").appendChild(item);
  }
  if(!items.length){
    const empty=document.createElement("p");
    empty.textContent="검색 결과가 없습니다. 검색어를 짧게 입력하거나 '새 종목'에서 직접 추가하세요.";
    $("libraryItems").appendChild(empty);
  }
}
function openExerciseLibrary(mode,sid,replaceId){
  libraryIntent={mode,sid,replaceId};
  $("libraryTitle").textContent=mode==="editorpick"?"종목 이름 선택":mode==="replace"?"전체 운동에서 종목 변경":"전체 운동에서 종목 추가";
  $("libraryHint").textContent="전체 5개 루틴 + 기본 종목 + 대체 종목 + 숨긴 종목에서 검색합니다. · v0.5.27";
  $("librarySearch").value="";$("exerciseLibrary").hidden=false;
  displayExerciseLibrary();$("librarySearch").focus();
}
function chooseLibraryExercise(choiceKey){
  const intent=libraryIntent,source=libraryChoices.get(choiceKey);
  if(!intent||!source)return;
  if(intent.mode==="pastadd"){
    const k=intent.date, b=body(k);
    if(k!==keyOf(view)||!b.session||b.session!==intent.sid){closeExerciseLibrary();toast('날짜가 변경됐습니다. 다시 선택하세요');return;}
    const snap=ensurePastSnapshot(k,b);
    if(snap.ex.some(e=>!e.archived&&librarySearchKey(e.n)===librarySearchKey(source.n))){
      closeExerciseLibrary();toast('이 날짜에 이미 있는 운동종목입니다');return;
    }
    const copy=cloneDayExercise(source);
    copy.id='historic-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
    copy.del=false;
    snap.ex.push(copy);
    open.add(copy.id);
    closeExerciseLibrary();persist(k,b);toast('이 날짜에 운동을 추가했습니다');return;
  }
  if(intent.mode==="editorpick"){
    if(!edState||edState.kind!=="ex"){
      closeExerciseLibrary();toast("종목 설정을 다시 열어 주세요");return;
    }
    const n=$("ed-n");if(!n){closeExerciseLibrary();return;}
    n.value=source.n;
    // Fill supporting metadata only when adding a brand-new exercise;
    // keep existing exercise configuration and its historical ID intact.
    if(!edState.id){
      for(const [field,value] of [["ed-tgt",source.tgt||""],["ed-part",source.part||""],
        ["ed-note",source.note||""],["ed-rest",String(source.rest||90)],
        ["ed-sets",String(source.sets||3)],["ed-alts",(source.alts||[]).join(", ")]]){
        const el=$(field);if(el)el.value=value;
      }
      const r=source.r||[];
      if($("ed-lo"))$("ed-lo").value=r[0]||"";
      if($("ed-hi"))$("ed-hi").value=r[1]||"";
      if($("ed-inc"))$("ed-inc").value=source.inc||"";
      if($("ed-top"))$("ed-top").value=String(source.top||0);
    }
    closeExerciseLibrary();n.focus();toast("종목명을 선택했습니다. 저장을 눌러 적용하세요");return;
  }
  const dest=SMAP[intent.sid];if(!dest)return;
  const old=intent.mode==="replace"?dest.ex.find(x=>x.id===intent.replaceId):null;
  if(intent.mode==="replace"&&!old){
    toast("교체할 원래 운동을 찾지 못했습니다. 다시 시도하세요.");return;
  }
  if(activeEx(dest).some(x=>librarySearchKey(x.n)===librarySearchKey(source.n)&&x.id!==intent.replaceId)){
    toast("이 루틴에 같은 이름의 종목이 이미 있습니다.");return;
  }
  const apply=async()=>{
    const before=routineData();
    const clone=JSON.parse(JSON.stringify(source));
    clone.id=newRoutineExerciseId();clone.del=false;
    delete clone.s;
    const prior=dest.ex.find(x=>x.id===intent.replaceId);
    if(intent.mode==="replace"&&prior){
      const pos=dest.ex.indexOf(prior);
      prior.del=true;
      dest.ex.splice(pos+1,0,clone);
      open.delete(prior.id);
    }else dest.ex.push(clone);
    closeExerciseLibrary();
    if(document.activeElement&&typeof document.activeElement.blur==="function")document.activeElement.blur();
    open.add(clone.id);
    const saved=await saveRoutine();
    if(!saved){
      applyRoutine(before);render();
      toast("운동 변경을 저장하지 못했습니다. 다시 시도하세요.");
      return;
    }
    // If a user adds/replaces an exercise during today's workout, append that
    // NEW exercise to today's snapshot too; do not rewrite historical snapshots.
    if(tab==='day'&&keyOf(view)===keyOf(today())){
      const k=keyOf(view),day=body(k);
      if(day.session===intent.sid){
        if(!validDaySnapshot(day.routineSnapshot,day.session))day.routineSnapshot=makeDaySnapshot(day.session);
        else {
          if(intent.mode==='replace'){
            const oldDay=day.routineSnapshot.ex.find(e=>e.id===intent.replaceId);
            if(oldDay)oldDay.archived=true;
          }
          if(!day.routineSnapshot.ex.some(e=>e.id===clone.id))day.routineSnapshot.ex.push(cloneDayExercise(clone));
        }
        await persist(k,day);
      }
    }
    // Display the resulting routine in day view. Keep old historical sets intact.
    if(tab!=="day")tab="day";
    changing=false;
    render();
    toast(intent.mode==="replace"
      ?"종목 변경 완료: "+clone.n+" (기존 기록 보존)"
      :"종목 추가 완료: "+clone.n);
  };
  if(intent.mode==="replace"){
    ask("기존 종목은 현재 루틴에서 제외되고, 이미 저장된 기록은 보관됩니다. '"+source.n+"'으로 변경할까요?","종목 변경",apply);
  }else apply();
}
let routineRemovalPending=false;
function removeRoutineExercise(id){
  const ex=EX[id];if(!ex||ex.del)return;
  if(routineRemovalPending){toast("이전 종목 삭제 저장 중입니다");return;}
  ask(`'${ex.n}'을(를) 루틴에서 제외할까요? 기존 운동 기록은 기록 탭에서 확인할 수 있습니다.`,"루틴에서 삭제",async()=>{
    if(routineRemovalPending)return;
    routineRemovalPending=true;
    const before=routineData();
    ex.del=true;open.delete(id);
    try{
      const saved=await saveRoutine();
      if(saved)toast("종목을 현재 루틴에서 제외했습니다 · 과거 기록 유지");
      else {applyRoutine(before);render();toast("종목 삭제에 실패했습니다. 다시 시도하세요")}
    }finally{routineRemovalPending=false;}
  });
}
function discardSelectedDay(){
  const k=keyOf(view);
  if(k!==keyOf(today()))return;
  const b=body(k);if(!b.session)return;
  ask(`${k}의 모든 세트·완료 표시·대체 종목·메모·세션 선택을 삭제합니다. 서버와 워치에도 반영되며 복원할 수 없습니다. 삭제할까요?`,"오늘 기록 폐기",()=>{
    const empty=norm(null);
    open.clear();changing=false;stopTimer();persist(k,empty);
    toast("오늘 운동을 폐기했습니다");
  });
}
$("libraryCancel").addEventListener("click",closeExerciseLibrary);
$("exerciseLibrary").addEventListener("click",e=>{if(e.target===$("exerciseLibrary"))closeExerciseLibrary()});
$("librarySearch").addEventListener("input",displayExerciseLibrary);
function pendingPlanCards(){
  return [...document.querySelectorAll('.routine-card')].filter(card=>{
    const ex=EX[card.dataset.planEx];if(!ex)return false;
    const rows=[...card.querySelectorAll('.routine-plan-row')].map(row=>{
      const val=key=>row.querySelector(`[data-plan-field="${key}"]`)?.value??'';
      return {kg:Number(val('kg')),reps:Number(val('reps')),tag:val('tag')};
    });
    return JSON.stringify(rows)!==JSON.stringify(routinePlanRows(ex).map(r=>({kg:Number(r.kg),reps:Number(r.reps),tag:r.tag||''})));
  }).length>0;
}
let routineOrderSaving=false;
async function moveEx(id,dir){
  if(routineOrderSaving)return;
  if(pendingPlanCards()){toast('먼저 변경한 세트 구성을 저장한 뒤 순서를 이동하세요');return;}
  const ex=EX[id];if(!ex)return;
  const s=SMAP[ex.s],act=activeEx(s),i=act.findIndex(e=>e.id===id),j=i+dir;
  if(j<0||j>=act.length)return;
  routineOrderSaving=true;
  const before=routineData(),a=s.ex.indexOf(act[i]),b=s.ex.indexOf(act[j]);
  [s.ex[a],s.ex[b]]=[s.ex[b],s.ex[a]];
  const saved=await saveRoutine();
  if(!saved){applyRoutine(before);render();toast('순서 저장 실패 · 이전 순서로 복원했습니다');}
  else toast('루틴 운동 순서를 저장했습니다');
  routineOrderSaving=false;
}
let dayOrderSaving=false;
async function moveDayExercise(id,dir){
  if(!backend||dayOrderSaving)return;
  const k=keyOf(view),day=body(k);
  if(!day.session){toast('먼저 세션을 선택하세요');return;}
  // A date-owned snapshot isolates today's and historical order from routine edits.
  const snapshot=validDaySnapshot(day.routineSnapshot,day.session)
    ?day.routineSnapshot
    :k<keyOf(today())?ensurePastSnapshot(k,day):makeDaySnapshot(day.session);
  if(!snapshot)return;
  day.routineSnapshot=snapshot;
  const current=dayExerciseList(k,day).filter(e=>!e.archived);
  const index=current.findIndex(e=>e.id===id),target=index+dir;
  if(index<0||target<0||target>=current.length)return;
  const first=snapshot.ex.findIndex(e=>e.id===current[index].id);
  const second=snapshot.ex.findIndex(e=>e.id===current[target].id);
  if(first<0||second<0)return;
  [snapshot.ex[first],snapshot.ex[second]]=[snapshot.ex[second],snapshot.ex[first]];
  dayOrderSaving=true;
  try{await persist(k,day);toast('이 날짜의 운동 순서를 저장했습니다');}
  finally{dayOrderSaving=false;}
}
let addChoiceSid=null,addChoiceDay=null;
function openAddChoice(sid){

async function syncReq(path,method,body){
  if(!syncConf)throw Error('No sync configuration');
  const res=await fetch(syncConf.url+path,{method:method||"GET",headers:{"Authorization":"Bearer "+syncConf.token,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined,cache:"no-store"});
  if(!res.ok){const reason=res.status===401?'인증 토큰 확인 필요':res.status===409?'다른 기기와 기록 충돌':res.status===413?'전송 데이터 크기 초과':res.status>=500?'서버 오류':'요청 오류';throw Error('동기화 실패 '+res.status+' · '+reason)}return res.json();
}
function syncQueueDay(k,b){if(!syncConf)return;syncPending[k]=structuredClone(b);syncFlush()}

async function syncFlush(){

  syncBusy=true;
  try{
    for(const k of Object.keys(syncPending)){
      const data=syncPending[k];const ep=k==='routine'?'/api/routine':'/api/day/'+k;
      try{
        const out=await syncReq(ep,'PUT',{data,revision:syncRev[k]||0});syncRev[k]=out.revision;
        if(syncPending[k]===data)delete syncPending[k];
      }catch(e){if(String(e).includes('409')){syncError='동일 날짜가 다른 기기에서 변경됐습니다. 충돌을 확인하세요.';}throw e}
    }
    syncError='';
  }catch(e){syncError=e.message;}
  finally{syncBusy=false;syncPanel()}
}
async function syncPoll(){
  if(!syncConf||!syncBooted||syncBusy||Object.keys(syncPending).length)return;
  try{
    const state=await syncReq('/api/state');
    let changed=false;
    for(const [k,remote] of Object.entries(state.days||{})){
      const nextRev=state.revisions[k]||0;
      if(nextRev!==(syncRev[k]||0)){
        docs[k]=norm(remote);syncRev[k]=nextRev;changed=true;
      }
    }
    if((state.revisions.routine||0)!==(syncRev.routine||0)){
      if(state.routine && Object.keys(state.routine).length){applyRoutine(state.routine);await backend.saveRoutine(state.routine)}
      syncRev.routine=state.revisions.routine||0;changed=true;
    }
    if(changed){await backend.saveAll();render()}
    syncError='';
  }catch(e){syncError=e.message;}

async function syncStart(force=false){

  // local records or drop edits waiting in the upload queue.
  if(force&&syncBooted){await syncFlush();await syncPoll();return;}
  try{
    const state=await syncReq('/api/state');
    const remoteCount=Object.keys(state.days||{}).length;
    const localCount=Object.keys(docs).length;
    if(remoteCount&&localCount&&!syncBooted){
      // Guard against overwriting local records when pairing a pre-existing remote account.
      const remoteKeys=Object.keys(state.days);
      const canonical=v=>JSON.stringify(v,(key,value)=>value&&typeof value==='object'&&!Array.isArray(value)?Object.fromEntries(Object.entries(value).sort(([a],[b])=>a.localeCompare(b))):value);
      const diff=remoteKeys.some(k=>canonical(norm(docs[k]))!==canonical(norm(state.days[k])));
      if(diff&&!confirm('서버에 기존 기록이 있습니다. 서버의 기록으로 휴대폰 기록을 교체할까요? 먼저 JSON 백업을 권장합니다.')){
        syncError='연결 설정은 유지했습니다. 휴대폰/서버 기록이 달라 자동 동기화를 중단했습니다. JSON 백업 후 연결 / 새로고침에서 다시 확인해 주세요.';
        syncBooted=false;syncPanel();return;
      }
    }
    if(remoteCount){
      docs={};for(const [k,b] of Object.entries(state.days))docs[k]=norm(b);
      if(state.routine && Object.keys(state.routine).length){applyRoutine(state.routine);await backend.saveRoutine(state.routine)}
